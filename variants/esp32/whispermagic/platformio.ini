[env:whispermagic]
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = WHISPERMAGIC
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = false
custom_meshtastic_display_name = WhisperMagic v1

extends = esp32_base
board = esp32doit-devkit-v1
build_flags =
  ${esp32_base.build_flags}
  -D WHISPERMAGIC
  -I variants/esp32/whispermagic
  ; ---- WhisperMagic defaults ----
  ; 915 MHz US band (SX1276 hardware)
  -D USERPREFS_CONFIG_LORA_REGION=meshtastic_Config_LoRaConfig_RegionCode_US
  ; Long-range balanced preset — good for outdoor mesh text
  -D USERPREFS_LORACONFIG_MODEM_PRESET=meshtastic_Config_LoRaConfig_ModemPreset_LONG_FAST
  ; Standard client role
  -D USERPREFS_CONFIG_DEVICE_ROLE=meshtastic_Config_DeviceConfig_Role_CLIENT
  ; No GPS hardware on this board
  -D MESHTASTIC_EXCLUDE_GPS=1
